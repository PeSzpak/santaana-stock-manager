<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpeza - Armazém Santa Ana</title>
    <link rel="icon" type="image/png" href="../assets/icon.png">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/crud.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo-container">
                <img src="../assets/logo.png" alt="Armazém Santa Ana" class="logo">
            </div>
            
            <nav class="nav-menu">
                <ul>
                    <li><a href="../index.html" class="nav-link">Início</a></li>
                    <li><a href="mercearia.html" class="nav-link">Mercearia</a></li>
                    <li><a href="limpeza.html" class="nav-link active">Limpeza</a></li>
                    <li><a href="carnes.html" class="nav-link">Carnes</a></li>
                    <li><a href="bebidas.html" class="nav-link">Bebidas</a></li>
                    <li><a href="historia.html" class="nav-link">Nossa História</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1>Limpeza</h1>
                <button class="user-btn">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="20" cy="20" r="20" fill="white"/>
                        <path d="M20 20C23.3137 20 26 17.3137 26 14C26 10.6863 23.3137 8 20 8C16.6863 8 14 10.6863 14 14C14 17.3137 16.6863 20 20 20Z" fill="#C1694F"/>
                        <path d="M20 22C13.3726 22 8 25.134 8 29V32H32V29C32 25.134 26.6274 22 20 22Z" fill="#C1694F"/>
                    </svg>
                </button>
            </header>

            <div class="page-header">
                <h2 class="page-title">Gestão de Estoque - Limpeza</h2>
                <div class="actions-bar">
                    <input type="text" id="searchInput" class="search-box" placeholder="Buscar produto...">
                    <button class="btn btn-primary" id="addBtn">Adicionar Produto</button>
                </div>
            </div>

            <div class="content-wrapper">
                <div class="table-container">
                    <table class="data-table" id="dataTable">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Produto</th>
                                <th>Categoria</th>
                                <th>Quantidade</th>
                                <th>Unidade</th>
                                <th>Preço</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="7">
                                    <div class="empty-state">
                                        <div class="empty-state-icon">🧹</div>
                                        <h3>Nenhum produto cadastrado</h3>
                                        <p>Clique em "Adicionar Produto" para começar</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Adicionar Produto</h2>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="productCode">Código</label>
                        <input type="text" id="productCode" required>
                    </div>
                    <div class="form-group">
                        <label for="productName">Nome do Produto</label>
                        <input type="text" id="productName" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="productCategory">Categoria</label>
                        <select id="productCategory" required>
                            <option value="">Selecione...</option>
                            <option value="Detergentes">Detergentes</option>
                            <option value="Desinfetantes">Desinfetantes</option>
                            <option value="Sabões">Sabões</option>
                            <option value="Acessórios">Acessórios</option>
                            <option value="Multiuso">Multiuso</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="productUnit">Unidade</label>
                        <select id="productUnit" required>
                            <option value="">Selecione...</option>
                            <option value="L">L</option>
                            <option value="mL">mL</option>
                            <option value="Kg">Kg</option>
                            <option value="g">g</option>
                            <option value="Un">Un</option>
                            <option value="Pct">Pct</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="productQuantity">Quantidade</label>
                        <input type="number" id="productQuantity" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Preço (R$)</label>
                        <input type="number" id="productPrice" min="0" step="0.01" required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
                    <button type="submit" class="btn btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/limpeza.js"></script>
</body>
</html>
